services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  api:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - api-node-modules:/app/node_modules
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/customer-complaint
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_PROXY_TARGET: http://api:5000
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: sh -c "npm install && npm run dev"

volumes:
  mongo-data:
  api-node-modules:
  frontend-node-modules:
