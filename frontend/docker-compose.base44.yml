services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  api:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/customer-complaint
      - JWT_EXPIRES_IN=7d
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npm run dev"

volumes:
  mongo-data: